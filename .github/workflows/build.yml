name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pctool/iesave.py selftest
      - name: VERSION matches app.h
        run: |
          a=$(grep -oP '#define VERSION "\K[^"]+' 3ds/source/app.h)
          f=$(tr -d ' \n\r' < VERSION)
          echo "app.h=$a VERSION=$f"; test "$a" = "$f"
      - run: tests/parity.sh

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C 3ds
      - uses: actions/upload-artifact@v4
        with:
          name: elf
          path: |
            3ds/iesm.3dsx
            3ds/iesm.elf

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: 3ds

      - name: Install makerom and bannertool
        run: |
          curl -sL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip -o /tmp/makerom.zip
          sudo unzip -o /tmp/makerom.zip -d /usr/local/bin
          curl -sL https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz -o /tmp/bannertool.tar.gz
          tar xf /tmp/bannertool.tar.gz -C /tmp
          sudo find /tmp -name bannertool -type f -exec cp {} /usr/local/bin/ \;
          sudo chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool

      - name: Package CIA
        run: 3ds/package.sh

      - name: Generate download QR code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pip install --quiet qrcode pillow
          python3 tools/gen_assets.py --qr \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/iesm.cia" \
            qr-cia.png

      - uses: actions/upload-artifact@v4
        with:
          name: iesm
          path: |
            3ds/iesm.cia
            3ds/iesm.3dsx

      - name: Write changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          {
            echo "Scan with FBI (Remote Install → Scan QR Code) to install:"
            echo
            echo "![QR](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/qr-cia.png)"
            echo
            echo "## Changes"
            git log --format='- %s' ${prev:+$prev..}${{ github.ref_name }} -- | grep -v "Auto-generate release notes" || true
          } > RELEASE_NOTES.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            3ds/iesm.cia
            3ds/iesm.3dsx
            qr-cia.png
